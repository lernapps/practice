name: Check

# The tests of the scripts in actions/ (node:test, no dependencies), the workflows (actionlint) and the files that
# people read. The job `check` always runs and reports the result: the one check to require.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  check: # required status check: always runs, fails when a job above failed or was cancelled
    needs: [test, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs ended: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
