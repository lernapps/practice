<li class="explainer-assessment-item" data-key="a13"><p class="explainer-assessment-label">Aufgabe 13</p><div class="question" id="frage-a13" data-id="a13" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Ursachen für Bildungsungleichheit werden genannt?</legend>
<label class="question-option"><input type="checkbox" name="frage-a13" value="0"> <span>ein Teufelskreis aus Herkunft und Bildungserfolg</span></label>
<label class="question-option"><input type="checkbox" name="frage-a13" value="1"> <span>soziale Trennung zwischen Schulen (Segregation)</span></label>
<label class="question-option"><input type="checkbox" name="frage-a13" value="2"> <span>weniger digitale Geräte und Medienkompetenz zu Hause</span></label>
<label class="question-option"><input type="checkbox" name="frage-a13" value="3"> <span>Kinder aus ärmeren Familien sind weniger begabt.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>ein Teufelskreis aus Herkunft und Bildungserfolg</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Wer wenig Bildung mitbekommt, gibt oft auch selbst weniger weiter.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>soziale Trennung zwischen Schulen (Segregation)</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Kinder aus privilegierten Familien besuchen oft andere Schulen.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>weniger digitale Geräte und Medienkompetenz zu Hause</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das benachteiligt beim Lernen und später auf dem Arbeitsmarkt.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Kinder aus ärmeren Familien sind weniger begabt.</strong></p><p>Das stimmt nicht. Gerade bei gleichen Kompetenzen bekommen sie seltener eine Gymnasialempfehlung.</p></li>
</ul>
<p class="question-explanation">Die Ursachen liegen in der Gesellschaft, nicht in der Begabung der Kinder.</p>
