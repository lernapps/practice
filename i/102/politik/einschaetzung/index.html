<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jede Situation zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Der UN-Sicherheitsrat beschließt Sanktionen gegen einen Staat.</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">Politik im weiteren Sinn</option><option value="0">Politik im engeren Sinn</option><option value="2">nicht politisch</option></select></label></li>
<li><label><span>Ein Kurs entscheidet, ob es Referate oder Podcasts für die Note gibt.</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">Politik im weiteren Sinn</option><option value="0">Politik im engeren Sinn</option><option value="2">nicht politisch</option></select></label></li>
<li><label><span>Du kaufst ein Buch über eine Politikerin.</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">Politik im weiteren Sinn</option><option value="0">Politik im engeren Sinn</option><option value="2">nicht politisch</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Der UN-Sicherheitsrat beschließt Sanktionen gegen einen Staat. – Politik im engeren Sinn; Ein Kurs entscheidet, ob es Referate oder Podcasts für die Note gibt. – Politik im weiteren Sinn; Du kaufst ein Buch über eine Politikerin. – nicht politisch</p>
<p class="question-explanation">Der Sicherheitsrat entscheidet verbindlich für Staaten. Der Kurs entscheidet nur für sich. Beim Buchkauf muss nichts geregelt werden – auch wenn das Thema Politik ist.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Politik" rel="noopener" title="Politik (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Politik (Wikipedia)</span></a></p>

</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche sind Kernelemente von Politik?</legend>
<label class="question-option"><input type="checkbox" name="frage-a2" value="0"> <span>Konflikt</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="1"> <span>Interesse</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="2"> <span>Macht</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="3"> <span>Konsens</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="4"> <span>Zufall</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Konflikt</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ohne unterschiedliche Positionen gäbe es nichts zu regeln.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Interesse</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Menschen und Gruppen wollen etwas erreichen. Das treibt Politik an.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Macht</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Wer Macht hat, kann Entscheidungen durchsetzen.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Konsens</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Am Ende steht oft eine Einigung, ein Konsens.</p></li>
<li class="question-info" data-option="4"><p class="question-info-head"><strong>Zufall</strong></p><p>Zufall gehört nicht zu den Kernelementen. Politik regelt bewusst.</p></li>
</ul>
<p class="question-explanation">Konflikt, Konsens, Interesse und Macht sind die vier Kernelemente – im engeren wie im weiteren Sinn.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Politik" rel="noopener" title="Politik (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Politik (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jede Definition (in eigenen Worten zusammengefasst) ihrem Typ zu. Ein Typ bleibt übrig.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Machiavelli (um 1513): Politik sind alle Mittel, um Macht zu bekommen, zu halten und zu nutzen.</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="2">marxistisch</option><option value="4">historisch</option><option value="0">pragmatisch</option><option value="3">empirisch-analytisch</option><option value="1">normativ</option></select></label></li>
<li><label><span>Aristoteles: Politik ist das angeborene Streben nach einem guten Leben in der Gemeinschaft.</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="2">marxistisch</option><option value="4">historisch</option><option value="0">pragmatisch</option><option value="3">empirisch-analytisch</option><option value="1">normativ</option></select></label></li>
<li><label><span>Marxistisch-leninistisches Wörterbuch (1969): Politik ist der Kampf der Klassen um ihre wirtschaftlichen Interessen.</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="2">marxistisch</option><option value="4">historisch</option><option value="0">pragmatisch</option><option value="3">empirisch-analytisch</option><option value="1">normativ</option></select></label></li>
<li><label><span>Easton (1954): Politik ist ein System, das verbindlich über die Verteilung von Gütern entscheidet.</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="2">marxistisch</option><option value="4">historisch</option><option value="0">pragmatisch</option><option value="3">empirisch-analytisch</option><option value="1">normativ</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Machiavelli (um 1513): Politik sind alle Mittel, um Macht zu bekommen, zu halten und zu nutzen. – pragmatisch; Aristoteles: Politik ist das angeborene Streben nach einem guten Leben in der Gemeinschaft. – normativ; Marxistisch-leninistisches Wörterbuch (1969): Politik ist der Kampf der Klassen um ihre wirtschaftlichen Interessen. – marxistisch; Easton (1954): Politik ist ein System, das verbindlich über die Verteilung von Gütern entscheidet. – empirisch-analytisch</p>
<p class="question-explanation">Macht → pragmatisch, gutes Leben → normativ, Klassenkampf → marxistisch, verbindliche Entscheidungen → empirisch-analytisch. Einen „historischen“ Politikbegriff gibt es unter den vier Typen nicht.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Politik" rel="noopener" title="Politik (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Politik (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lehmbruch (1968): Politik ist gesellschaftliches Handeln, das Konflikte über Werte verbindlich regeln will. Welcher Typ ist das?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>empirisch-analytisch</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>normativ</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>pragmatisch</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="3"> <span>marxistisch</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>empirisch-analytisch</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Es geht um das verbindliche Regeln von Konflikten. Das ist der Blick auf Politik als Entscheidungssystem.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>normativ</strong></p><p>Normativ wäre es, wenn die Definition sagt, welche Ordnung gut ist. Lehmbruch beschreibt nur, was Politik tut.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>pragmatisch</strong></p><p>Pragmatisch wäre eine Definition über Macht. Macht kommt bei Lehmbruch nicht vor.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>marxistisch</strong></p><p>Marxistisch wäre eine Definition über Klassenkampf. Lehmbruch spricht von Konflikten über Werte.</p></li>
</ul>
<p class="question-explanation">Wer Politik als verbindliches Regeln von Konflikten beschreibt, denkt empirisch-analytisch.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Politik" rel="noopener" title="Politik (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Politik (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>

<div class="question-reveal" hidden>

<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Politik" rel="noopener" title="Politik (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Politik (Wikipedia)</span></a></p>

<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="multiple-choice">

<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>der Bundestag als Institution</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Institutionen gehören zur Form der Politik.</p></li>
