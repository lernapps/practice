<form class="question-form" novalidate>
<fieldset>

<ul class="question-pairs">
<li><label><span>Klasse</span> <select name="frage-a54-0" data-left="0"><option value="">bitte wählen</option><option value="2">Lage plus Werte und Lebensstil</option><option value="1">ähnlicher Status nach Bildung, Einkommen, Beruf</option><option value="0">Besitz oder Nichtbesitz von Produktionsmitteln</option><option value="3">Stellung durch Geburt festgelegt</option></select></label></li>
<li><label><span>Schicht</span> <select name="frage-a54-1" data-left="1"><option value="">bitte wählen</option><option value="2">Lage plus Werte und Lebensstil</option><option value="1">ähnlicher Status nach Bildung, Einkommen, Beruf</option><option value="0">Besitz oder Nichtbesitz von Produktionsmitteln</option><option value="3">Stellung durch Geburt festgelegt</option></select></label></li>

<li class="explainer-assessment-item" data-key="a55"><p class="explainer-assessment-label">Aufgabe 55</p><div class="question" id="frage-a55" data-id="a55" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was meint „nivellierte Mittelstandsgesellschaft“?</legend>
<label class="question-option"><input type="radio" name="frage-a55" value="0"> <span>Es gibt keine echten Klassenschranken mehr; fast alle gehören zur Mitte.</span></label>
<label class="question-option"><input type="radio" name="frage-a55" value="1"> <span>Die Gesellschaft ist in zwei feindliche Klassen gespalten.</span></label>
<label class="question-option"><input type="radio" name="frage-a55" value="2"> <span>Die Mitte wird immer kleiner.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Es gibt keine echten Klassenschranken mehr; fast alle gehören zur Mitte.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Nivelliert heißt eingeebnet – die Unterschiede seien verschwunden.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Die Gesellschaft ist in zwei feindliche Klassen gespalten.</strong></p><p>Das ist das Klassenmodell von Marx – das Gegenteil.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Die Mitte wird immer kleiner.</strong></p><p>Das behaupten die Kritiker. Der Begriff selbst meint eine große, gleiche Mitte.</p></li>
</ul>
<p class="question-explanation">Der Kommentar hält diese Vorstellung für ein Märchen – die Vermögenszahlen sprächen dagegen.</p>

 Rousseau, Karl Marx","right":"Sozialismus"},{"left":"Edmund Burke, Thomas Hobbes","right":"Konservatismus"},{"left":"Pierre-Joseph Proudhon, Errico Malatesta","right":"Libertarismus/Anarchismus"}]},"rendered":{}}},{"key":"a11","ref":"/grundorientierungen/links-rechts-schema/#kombination-zuordnen","page":"grundorientierungen/links-rechts-schema/","exercise":"kombination-zuordnen","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a11","text":"Welche Grundorientierung liegt in welchem Feld? Ordne die Kombination zu.","explanation":"Oben links Anarchismus, oben rechts Liberalismus, unten links Sozialismus, unten rechts Konservatismus.","links":[{"title":"Politisches Spektrum (Wikipedia)","url":"https://de.wikipedia.org/wiki/Politisches_Spektrum"}],"type":"matching","pairs":[{"left":"Markt verteilt + Ordnung durch freien Zusammenschluss","right":"Liberalismus"},{"left":"Politik verteilt + Ordnung durch freien Zusammenschluss","right":"Libertarismus/Anarchismus"},{"left":"Politik verteilt + Ordnung durch Staat und Tradition","right":"Sozialismus"},{"left":"Markt verteilt + Ordnung durch Staat und Tradition","right":"Konservatismus"}]},"rendered":{}}},{"key":"a12","ref":"/grundorientierungen/links-rechts-schema/#partei-verorten","page":"grundorientierungen/links-rechts-schema/","exercise":"partei-verorten","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a12","text":"Eine Partei will hohe Steuern für Reiche, um umzuverteilen, und eine starke staatliche Ordnung. In welches Feld passt sie?","explanation":"Kombiniere beide Achsen. Gleichheit plus Autorität ergibt das Feld unten links.","links":[{"title":"Politisches Spektrum (Wikipedia)","url":"https://de.wikipedia.org/wiki/Politisches_Spektrum"}],"type":"single-choice","options":[{"text":"Sozialismus (unten links)","correct":true,"info":"Umverteilen durch Politik heißt Gleichheit (links), starke staatliche Ordnung heißt Autorität (unten)."},{"text":"Liberalismus (oben rechts)","correct":false,"info":"Der Liberalismus will wenig Umverteilung und wenig staatliche Ordnung."},{"text":"Libertarismus/Anarchismus (oben links)","correct":false,"info":"Gleichheit passt, aber der Anarchismus lehnt eine staatliche Ordnung ab."},{"text":"Konservatismus (unten rechts)","correct":false,"info":"Starke Ordnung passt, aber der Konservatismus setzt bei der Verteilung auf den Markt."}]},"rendered":{}}},{"key":"a13","ref":"/staat-gesellschaft/staat-und-gesellschaft/#staat-erkennen","page":"staat-gesellschaft/staat-und-gesellschaft/","exercise":"staat-erkennen","step":4,"data":{"kind":"question","lang":"de","question":{"id":"a13","text":"Was gehört zum Staat?","explanation":"Zum Staat gehört, was verbindlich entscheidet und Sicherheit schafft. Familie und Verein sind Gesellschaft.","links":[{"title":"Staat (Wikipedia)","url":"https://de.wikipedia.org/wiki/Staat"}],"type":"multiple-choice","options":[{"text":"Eine Polizistin regelt den Verkehr.","correct":true,"info":"Die Polizei sorgt für innere Sicherheit, eine Aufgabe des Staates."},{"text":"Der Bundestag beschließt ein Gesetz.","correct":true,"info":"Das Parlament ist ein Organ des Staates."},{"text":"Eine Familie frühstückt zusammen.","correct":false,"info":"Die Familie gehört zur Gesellschaft, dem Raum der freien Bürgerinnen und Bürger."},{"text":"Ein Sportverein wählt seinen Vorstand.","correct":false,"info":"Im Verein schließen sich Menschen freiwillig zusammen. Das ist Gesellschaft."}]},"rendered":{}}},{"key":"a14","ref":"/staat-gesellschaft/staat-und-gesellschaft/#begriffe-zuordnen","page":"staat-gesellschaft/staat-und-gesellschaft/","exercise":"begriffe-zuordnen","step":4,"data":{"kind":"question","lang":"de","question":{"id":"a14","text":"Ordne jedem Begriff seine Bedeutung zu.","explanation":"Diese drei Wörter brauchst du, um Gesellschaft zu beschreiben.","links":[{"title":"Gesellschaft (Soziologie) (Wikipedia)","url":"https://de.wikipedia.org/wiki/Gesellschaft_(Soziologie)"}],"type":"matching","pairs":[{"left":" ette-ordnen","step":14,"data":{"kind":"question","lang":"de","question":{"id":"a41","text":"Bring die Gedankenkette von Marx in die richtige Reihenfolge.","explanation":"Abhängigkeit → Verelendung → Klassenbewusstsein → Klassenkampf und Revolution.","links":[{"title":"Klassenkampf (Wikipedia)","url":"https://de.wikipedia.org/wiki/Klassenkampf"}],"type":"ordering","items":["Die Lohnarbeiter müssen ihre Arbeitskraft an die Besitzer verkaufen.","Konkurrenz und Lohndruck führen zur Verelendung der Arbeiter.","Die Arbeiter werden sich ihrer Lage bewusst und organisieren sich.","Im Klassenkampf beseitigt eine Revolution das Privateigentum an Produktionsmitteln."]},"rendered":{}}},{"key":"a42","ref":"/modelle/klassengesellschaft-heute/#argumente-dafuer","page":"modelle/klassengesellschaft-heute/","exercise":"argumente-dafuer","step":14,"data":{"kind":"question","lang":"de","question":{"id":"a42","text":"Welche Aussagen sprechen für eine neue Klassengesellschaft?","explanation":"Dafür sprechen dauerhafte, vererbte Benachteiligungen; dagegen Wohlstand, Vielfalt und Sozialstaat.","links":[{"title":"Klassengesellschaft (Wikipedia)","url":"https://de.wikipedia.org/wiki/Klassengesellschaft"}],"type":"multiple-choice","options":[{"text":"57 % der Erwerbslosen sind von Armut bedroht.","correct":true,"info":"Eine Gruppe ist dauerhaft benachteiligt – das stützt das Klassenmodell."},{"text":"Die soziale Auslese beginnt schon nach der Grundschule.","correct":true,"info":"Wenn Herkunft früh über den Weg entscheidet, wird Ungleichheit vererbt."},{"text":"Auch die Unterschicht hat vom wachsenden Wohlstand profitiert.","correct":false,"info":"Das spricht dagegen – es gibt keine Verelendung wie bei Marx."},{"text":"Lebensstil und Engagement bestimmen die Position mit.","correct":false,"info":"Das spricht dagegen – nicht nur Besitz zählt."}]},"rendered":{}}},{"key":"a43","ref":"/modelle/klassengesellschaft-heute/#erwerbslose-quote","page":"modelle/klassengesellschaft-heute/","exercise":"erw
