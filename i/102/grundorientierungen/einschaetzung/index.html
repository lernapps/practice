<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">

<ul class="question-pairs">

<li><label><span>Der Mensch braucht Staat, Familie und Religion; jeder hat seinen Platz.</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">Libertarismus/Anarchismus</option><option value="0">Liberalismus</option><option value="2">Konservatismus</option><option value="1">Sozialismus</option></select></label></li>
<li><label><span>Mündige Menschen schließen sich freiwillig und ohne Zwang zusammen.</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="3">Libertarismus/Anarchismus</option><option value="0">Liberalismus</option><option value="2">Konservatismus</option><option value="1">Sozialismus</option></select></label></li>

<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Der Mensch ist vernünftig und hat ein Recht auf Leben, Freiheit und Eigentum. – Liberalismus; Der Mensch ist von Natur aus auf das Gemeinwohl ausgerichtet. – Sozialismus; Der Mensch braucht Staat, Familie und Religion; jeder hat seinen Platz. – Konservatismus; Mündige Menschen schließen sich freiwillig und ohne Zwang zusammen. – Libertarismus/Anarchismus</p>
<p class="question-explanation">Das Menschenbild erklärt, warum jede Grundorientierung den Staat so sieht, wie sie ihn sieht.</p>

<li><label><span>Politik verteilt + Ordnung durch freien Zusammenschluss</span> <select name="frage-a5-1" data-left="1"><option value="">bitte wählen</option><option value="0">Liberalismus</option><option value="2">Sozialismus</option><option value="3">Konservatismus</option><option value="1">Libertarismus/Anarchismus</option></select></label></li>

<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="single-choice">

<label class="question-option"><input type="radio" name="frage-a6" value="0"> <span>Sozialismus (unten links)</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>Liberalismus (oben rechts)</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="2"> <span>Libertarismus/Anarchismus (oben links)</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="3"> <span>Konservatismus (unten rechts)</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sozialismus (unten links)</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Umverteilen durch Politik heißt Gleichheit (links), starke staatliche Ordnung heißt Autorität (unten).</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Liberalismus (oben rechts)</strong></p><p>Der Liberalismus will wenig Umverteilung und wenig staatliche Ordnung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Libertarismus/Anarchismus (oben links)</strong></p><p>Gleichheit passt, aber der Anarchismus lehnt eine staatliche Ordnung ab.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Konservatismus (unten rechts)</strong></p><p>Starke Ordnung passt, aber der Konservatismus setzt bei der Verteilung auf den Markt.</p></li>
</ul>
<p class="question-explanation">Kombiniere beide Achsen. Gleichheit plus Autorität ergibt das Feld unten links.</p>
