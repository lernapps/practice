<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../kursarbeit/">Kursarbeitstraining</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 1</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was verlangt welcher Operator? Ein Eintrag bleibt übrig.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>beschreiben</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">darlegen und mit Beispielen veranschaulichen</option><option value="0">mit eigenen Worten geordnet darstellen</option><option value="2">Material zerlegen und Zusammenhänge zeigen</option><option value="3">ein begründetes Urteil fällen</option><option value="4">eine Zeichnung anfertigen</option></select></label></li>
<li><label><span>erläutern</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">darlegen und mit Beispielen veranschaulichen</option><option value="0">mit eigenen Worten geordnet darstellen</option><option value="2">Material zerlegen und Zusammenhänge zeigen</option><option value="3">ein begründetes Urteil fällen</option><option value="4">eine Zeichnung anfertigen</option></select></label></li>
<li><label><span>analysieren</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">darlegen und mit Beispielen veranschaulichen</option><option value="0">mit eigenen Worten geordnet darstellen</option><option value="2">Material zerlegen und Zusammenhänge zeigen</option><option value="3">ein begründetes Urteil fällen</option><option value="4">eine Zeichnung anfertigen</option></select></label></li>
<li><label><span>beurteilen</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">darlegen und mit Beispielen veranschaulichen</option><option value="0">mit eigenen Worten geordnet darstellen</option><option value="2">Material zerlegen und Zusammenhänge zeigen</option><option value="3">ein begründetes Urteil fällen</option><option value="4">eine Zeichnung anfertigen</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> beschreiben – mit eigenen Worten geordnet darstellen; erläutern – darlegen und mit Beispielen veranschaulichen; analysieren – Material zerlegen und Zusammenhänge zeigen; beurteilen – ein begründetes Urteil fällen</p>
<p class="question-explanation">Je höher der Bereich, desto mehr eigene Denkarbeit.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Operator_(Didaktik)" rel="noopener" title="Operator (Didaktik) (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Operator (Didaktik) (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Zu welchem Anforderungsbereich gehört „Stellung nehmen“?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>III Urteilen</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>II Anwenden</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>I Wiedergeben</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>III Urteilen</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Wer Stellung nimmt, wägt ab und urteilt.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>II Anwenden</strong></p><p>In II erklärst und analysierst du, urteilst aber noch nicht.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>I Wiedergeben</strong></p><p>In I gibst du nur wieder, was im Material steht.</p></li>
</ul>
<p class="question-explanation">Stellung nehmen, beurteilen und bewerten gehören zum Bereich III.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Operator_(Didaktik)" rel="noopener" title="Operator (Didaktik) (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Operator (Didaktik) (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedem Begriff sein Kernmerkmal zu. Ein Merkmal bleibt übrig.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Klasse</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="3">Stellung durch Geburt festgelegt</option><option value="0">Besitz oder Nichtbesitz von Produktionsmitteln</option><option value="2">Lage plus Werte und Lebensstil</option><option value="1">ähnlicher Status nach Bildung, Einkommen, Beruf</option></select></label></li>
<li><label><span>Schicht</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="3">Stellung durch Geburt festgelegt</option><option value="0">Besitz oder Nichtbesitz von Produktionsmitteln</option><option value="2">Lage plus Werte und Lebensstil</option><option value="1">ähnlicher Status nach Bildung, Einkommen, Beruf</option></select></label></li>
<li><label><span>Milieu</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">Stellung durch Geburt festgelegt</option><option value="0">Besitz oder Nichtbesitz von Produktionsmitteln</option><option value="2">Lage plus Werte und Lebensstil</option><option value="1">ähnlicher Status nach Bildung, Einkommen, Beruf</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Klasse – Besitz oder Nichtbesitz von Produktionsmitteln; Schicht – ähnlicher Status nach Bildung, Einkommen, Beruf; Milieu – Lage plus Werte und Lebensstil</p>
<p class="question-explanation">Die Stellung durch Geburt gehört zum Stand, nicht zu diesen drei Begriffen.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Sozialstruktur" rel="noopener" title="Sozialstruktur (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Sozialstruktur (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was meint „nivellierte Mittelstandsgesellschaft“?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Es gibt keine echten Klassenschranken mehr; fast alle gehören zur Mitte.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Die Gesellschaft ist in zwei feindliche Klassen gespalten.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Die Mitte wird immer kleiner.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Es gibt keine echten Klassenschranken mehr; fast alle gehören zur Mitte.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Nivelliert heißt eingeebnet – die Unterschiede seien verschwunden.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Die Gesellschaft ist in zwei feindliche Klassen gespalten.</strong></p><p>Das ist das Klassenmodell von Marx – das Gegenteil.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Die Mitte wird immer kleiner.</strong></p><p>Das behaupten die Kritiker. Der Begriff selbst meint eine große, gleiche Mitte.</p></li>
</ul>
<p class="question-explanation">Der Kommentar hält diese Vorstellung für ein Märchen – die Vermögenszahlen sprächen dagegen.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Nivellierte_Mittelstandsgesellschaft" rel="noopener" title="Nivellierte Mittelstandsgesellschaft (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Nivellierte Mittelstandsgesellschaft (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
