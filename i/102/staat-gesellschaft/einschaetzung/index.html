<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../staat-gesellschaft/">Staat und Gesellschaft</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 5 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was gehört zum Staat?</legend>
<label class="question-option"><input type="checkbox" name="frage-a1" value="0"> <span>Eine Polizistin regelt den Verkehr.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="1"> <span>Der Bundestag beschließt ein Gesetz.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="2"> <span>Eine Familie frühstückt zusammen.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="3"> <span>Ein Sportverein wählt seinen Vorstand.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Eine Polizistin regelt den Verkehr.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Polizei sorgt für innere Sicherheit, eine Aufgabe des Staates.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Der Bundestag beschließt ein Gesetz.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Parlament ist ein Organ des Staates.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Eine Familie frühstückt zusammen.</strong></p><p>Die Familie gehört zur Gesellschaft, dem Raum der freien Bürgerinnen und Bürger.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Ein Sportverein wählt seinen Vorstand.</strong></p><p>Im Verein schließen sich Menschen freiwillig zusammen. Das ist Gesellschaft.</p></li>
</ul>
<p class="question-explanation">Zum Staat gehört, was verbindlich entscheidet und Sicherheit schafft. Familie und Verein sind Gesellschaft.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Staat" rel="noopener" title="Staat (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Staat (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedem Begriff seine Bedeutung zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Gesellschaft (Wortursprung)</span> <select name="frage-a2-0" data-left="0"><option value="">bitte wählen</option><option value="3">vom Staat gelenkt</option><option value="0">Vereinigung von Gefährten</option><option value="1">unterschiedlich</option><option value="2">sich zusammenschließen</option></select></label></li>
<li><label><span>heterogen</span> <select name="frage-a2-1" data-left="1"><option value="">bitte wählen</option><option value="3">vom Staat gelenkt</option><option value="0">Vereinigung von Gefährten</option><option value="1">unterschiedlich</option><option value="2">sich zusammenschließen</option></select></label></li>
<li><label><span>assoziieren</span> <select name="frage-a2-2" data-left="2"><option value="">bitte wählen</option><option value="3">vom Staat gelenkt</option><option value="0">Vereinigung von Gefährten</option><option value="1">unterschiedlich</option><option value="2">sich zusammenschließen</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Gesellschaft (Wortursprung) – Vereinigung von Gefährten; heterogen – unterschiedlich; assoziieren – sich zusammenschließen</p>
<p class="question-explanation">Diese drei Wörter brauchst du, um Gesellschaft zu beschreiben.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Gesellschaft_(Soziologie)" rel="noopener" title="Gesellschaft (Soziologie) (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Gesellschaft (Soziologie) (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Aufgaben hat der Staat gegenüber der Gesellschaft?</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>Konflikte friedlich regeln</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>einen Rahmen durch Gesetze festlegen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>Rechtsschutz bieten</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>bestimmen, welchen Beruf jemand lernt</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Konflikte friedlich regeln</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Dafür schafft der Staat Verfahren und Instanzen, etwa Gerichte.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>einen Rahmen durch Gesetze festlegen</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Innerhalb dieses Rahmens können sich die Menschen frei entfalten.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Rechtsschutz bieten</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Wer im Recht ist, kann es mit Hilfe des Staates durchsetzen.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>bestimmen, welchen Beruf jemand lernt</strong></p><p>Die Berufswahl ist frei. Das gehört zur Freiheit in der Gesellschaft.</p></li>
</ul>
<p class="question-explanation">Der Staat sichert den Rahmen. Was innerhalb des Rahmens geschieht, lenkt er nicht.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Staat" rel="noopener" title="Staat (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Staat (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Aufgabe des Staates zeigt das Beispiel? Ordne zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Ein Gericht entscheidet einen Streit zwischen Nachbarn.</span> <select name="frage-a4-0" data-left="0"><option value="">bitte wählen</option><option value="1">Rahmen festlegen</option><option value="2">Gefahren abwehren</option><option value="0">Konflikte friedlich regeln</option><option value="3">Recht durchsetzen</option></select></label></li>
<li><label><span>Der Bundestag beschließt ein Jugendschutzgesetz.</span> <select name="frage-a4-1" data-left="1"><option value="">bitte wählen</option><option value="1">Rahmen festlegen</option><option value="2">Gefahren abwehren</option><option value="0">Konflikte friedlich regeln</option><option value="3">Recht durchsetzen</option></select></label></li>
<li><label><span>Die Feuerwehr schützt eine Stadt vor Hochwasser.</span> <select name="frage-a4-2" data-left="2"><option value="">bitte wählen</option><option value="1">Rahmen festlegen</option><option value="2">Gefahren abwehren</option><option value="0">Konflikte friedlich regeln</option><option value="3">Recht durchsetzen</option></select></label></li>
<li><label><span>Die Polizei sorgt dafür, dass ein Urteil befolgt wird.</span> <select name="frage-a4-3" data-left="3"><option value="">bitte wählen</option><option value="1">Rahmen festlegen</option><option value="2">Gefahren abwehren</option><option value="0">Konflikte friedlich regeln</option><option value="3">Recht durchsetzen</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Ein Gericht entscheidet einen Streit zwischen Nachbarn. – Konflikte friedlich regeln; Der Bundestag beschließt ein Jugendschutzgesetz. – Rahmen festlegen; Die Feuerwehr schützt eine Stadt vor Hochwasser. – Gefahren abwehren; Die Polizei sorgt dafür, dass ein Urteil befolgt wird. – Recht durchsetzen</p>
<p class="question-explanation">Der Staat sichert den Rahmen, in dem die Gesellschaft frei leben kann.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Staat" rel="noopener" title="Staat (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Staat (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was kennzeichnet ein totalitäres System?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Staat und Gesellschaft sind nicht mehr getrennt.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Der Staat hält sich ganz aus allem heraus.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Es gibt viele unabhängige Vereine und Parteien.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Staat und Gesellschaft sind nicht mehr getrennt.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Staat greift auf alle Lebensbereiche zu. Private Freiheit gibt es nicht mehr.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Der Staat hält sich ganz aus allem heraus.</strong></p><p>Das wäre das Gegenteil. Im totalitären System ist der Staat überall.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Es gibt viele unabhängige Vereine und Parteien.</strong></p><p>Freie Vereine und Parteien gehören zur Gesellschaft. Totalitäre Systeme unterdrücken sie.</p></li>
</ul>
<p class="question-explanation">Totalitär heißt, dass der Staat das ganze Leben bestimmt.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Totalitarismus" rel="noopener" title="Totalitarismus (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Totalitarismus (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
