<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 466" font-family="sans-serif" font-size="12" role="img">
<rect width="360" height="466" fill="#ffffff"/>
<text x="8" y="20" font-weight="bold" fill="#1a202c">Wie entwickelt sich Ihr Unternehmen beim</text>
<text x="8" y="35" font-weight="bold" fill="#1a202c">Nachwuchs- und Fachkräftemangel?</text>
<text x="8" y="60" fill="#1a202c" font-size="11">Es herrscht Fachkräftemangel</text>
<rect x="8" y="64" width="255.2" height="14" fill="#2b6cb0"/>
<text x="268.2" y="75" fill="#1a202c" font-size="11">44 %</text>
<text x="8" y="96" fill="#1a202c" font-size="11">Es herrscht Arbeitskräftemangel</text>
<rect x="8" y="100" width="203.0" height="14" fill="#2b6cb0"/>
<text x="216.0" y="111" fill="#1a202c" font-size="11">35 %</text>
<text x="8" y="132" fill="#1a202c" font-size="11">Knappheit von Nachwuchskräften</text>
<rect x="8" y="136" width="185.6" height="14" fill="#2b6cb0"/>
<text x="198.6" y="147" fill="#1a202c" font-size="11">32 %</text>
<text x="8" y="168" fill="#1a202c" font-size="11">Personal muss neue Kompetenzen haben</text>
<rect x="8" y="172" width="127.6" height="14" fill="#2b6cb0"/>
<text x="140.6" y="183" fill="#1a202c" font-size="11">22 %</text>
<text x="8" y="204" fill="#1a202c" font-size="11">Personalabbau in Teilen des Betriebs</text>
<rect x="8" y="208" width="92.8" height="14" fill="#2b6cb0"/>
<text x="105.8" y="219" fill="#1a202c" font-size="11">16 %</text>
<text x="8" y="240" fill="#1a202c" font-size="11">Mehr gehen in Ruhestand, als Nachwuchs kommt</text>
<rect x="8" y="244" width="92.8" height="14" fill="#2b6cb0"/>
<text x="105.8" y="255" fill="#1a202c" font-size="11">16 %</text>
<text x="8" y="276" fill="#1a202c" font-size="11">Angebot an Fachkräften reicht</text>
<rect x="8" y="280" width="87.0" height="14" fill="#2b6cb0"/>
<text x="100.0" y="291" fill="#1a202c" font-size="11">15 %</text>
<text x="8" y="312" fill="#1a202c" font-size="11">Angebot an Arbeitskräften reicht</text>
<rect x="8" y="316" width="81.2" height="14" fill="#2b6cb0"/>
<text x="94.2" y="327" fill="#1a202c" font-size="11">14 %</text>
<text x="8" y="348" fill="#1a202c" font-size="11">Angebot an Nachwuchskräften reicht</text>
<rect x="8" y="352" width="81.2" height="14" fill="#2b6cb0"/>
<text x="94.2" y="363" fill="#1a202c" font-size="11">14 %</text>
<text x="8" y="384" fill="#1a202c" font-size="11">Stellenabbau in Teilen des Betriebs</text>
<rect x="8" y="388" width="69.6" height="14" fill="#2b6cb0"/>
<text x="82.6" y="399" fill="#1a202c" font-size="11">12 %</text>
<text x="8" y="420" fill="#1a202c" font-size="11">Umgang mit „Workforce Ambidexterity“ nötig</text>
<rect x="8" y="424" width="40.6" height="14" fill="#2b6cb0"/>
<text x="53.6" y="435" fill="#1a202c" font-size="11">7 %</text>
<text x="8" y="456" font-size="10" fill="#4a5568">Anteil der Unternehmen (DACH-Region), mehrere Antworten möglich</text>
</svg>