<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="sans-serif" font-size="11" role="img">
<rect width="360" height="260" fill="#ffffff"/>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker></defs>
<path d="M30,150 A140,135 0 0 1 310,150 Z" fill="#e2e8f0" stroke="#1a202c" stroke-width="2"/>
<text x="170" y="66" text-anchor="middle" font-size="13" fill="#1a202c" font-weight="bold">Überbau</text>
<text x="170" y="90" text-anchor="middle" font-size="10" fill="#1a202c">Denkweise, politische Institutionen,</text>
<text x="170" y="105" text-anchor="middle" font-size="10" fill="#1a202c">Gesetze, Religion, Moral, Kunst,</text>
<text x="170" y="120" text-anchor="middle" font-size="10" fill="#1a202c">Philosophie, Wissenschaft</text>
<rect x="30" y="150" width="280" height="70" fill="#bee3f8" stroke="#1a202c" stroke-width="2"/>
<text x="170" y="176" text-anchor="middle" font-size="13" fill="#1a202c" font-weight="bold">Basis</text>
<text x="170" y="196" text-anchor="middle" font-size="10" fill="#1a202c">materielle, ökonomische und</text>
<text x="170" y="210" text-anchor="middle" font-size="10" fill="#1a202c">soziale Verhältnisse</text>
<line x1="335" y1="205" x2="335" y2="95" stroke="#c53030" stroke-width="2.5" marker-end="url(#p)"/>
<text x="350" y="150" text-anchor="middle" font-size="10" fill="#c53030" transform="rotate(-90 350 150)">bestimmt</text>
<text x="180" y="245" text-anchor="middle" font-size="11" fill="#4a5568">Nach Marx bestimmt die Basis den Überbau.</text>
</svg>