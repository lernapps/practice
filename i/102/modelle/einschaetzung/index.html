<label class="question-option"><input type="radio" name="frage-a8" value="1"> <span>Die Unterschicht ist verschwunden.</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="2"> <span>Alle Schichten sind gleich groß geworden.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Migrantinnen und Migranten sind in den unteren Etagen viel stärker vertreten als oben.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Viele Zugewanderte arbeiten in einfachen Berufen und schieben sich unter die einheimische Bevölkerung.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Die Unterschicht ist verschwunden.</strong></p><p>Die Unterschicht gibt es weiter, mit etwa 6 %.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Alle Schichten sind gleich groß geworden.</strong></p><p>Die Schichten sind weiter sehr verschieden groß.</p></li>
</ul>
<p class="question-explanation">Unterschichtung heißt, dass eine neue Gruppe unten in die Sozialstruktur eintritt.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Rainer_Gei%C3%9Fler" rel="noopener" title="Rainer Geißler (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Rainer Geißler (Wikipedia)</span></a></p>

</div></li>
<li class="explainer-assessment-item" data-key="a9"><p class="explainer-assessment-label">Aufgabe 9</p><div class="question" id="frage-a9" data-id="a9" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Beschreibung passt zu welchem Milieu? Ein Milieu bleibt übrig.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Gut gebildet, engagiert für Gemeinwohl, Nachhaltigkeit und Vielfalt.</span> <select name="frage-a9-0" data-left="0"><option value="">bitte wählen</option><option value="2">Expeditives Milieu</option><option value="0">Postmaterielles Milieu</option><option value="3">Prekäres Milieu</option><option value="4">Milieu der Performer</option><option value="1">Traditionelles Milieu</option></select></label></li>
<li><label><span>Ältere Generation, liebt Sicherheit und Ordnung, eher kleinbürgerlich.</span> <select name="frage-a9-1" data-left="1"><option value="">bitte wählen</option><option value="2">Expeditives Milieu</option><option value="0">Postmaterielles Milieu</option><option value="3">Prekäres Milieu</option><option value="4">Milieu der Performer</option><option value="1">Traditionelles Milieu</option></select></label></li>
<li><label><span>Jung, urban, digital, kreativ, sucht neue und ungewöhnliche Erfahrungen.</span> <select name="frage-a9-2" data-left="2"><option value="">bitte wählen</option><option value="2">Expeditives Milieu</option><option value="0">Postmaterielles Milieu</option><option value="3">Prekäres Milieu</option><option value="4">Milieu der Performer</option><option value="1">Traditionelles Milieu</option></select></label></li>
<li><label><span>Möchte dazugehören, kämpft mit Benachteiligungen und um Teilhabe.</span> <select name="frage-a9-3" data-left="3"><option value="">bitte wählen</option><option value="2">Expeditives Milieu</option><option value="0">Postmaterielles Milieu</option><option value="3">Prekäres Milieu</option><option value="4">Milieu der Performer</option><option value="1">Traditionelles Milieu</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Gut gebildet, engagiert für Gemeinwohl, Nachhaltigkeit und Vielfalt. – Postmaterielles Milieu; Ältere Generation, liebt Sicherheit und Ordnung, eher kleinbürgerlich. – Traditionelles Milieu; Jung, urban, digital, kreativ, sucht neue und ungewöhnliche Erfahrungen. – Expeditives Milieu; Möchte dazugehören, kämpft mit Benachteiligungen und um Teilhabe. – Prekäres Milieu</p>
<p class="question-explanation">Lage und Werte zusammen machen ein Milieu aus.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Sinus-Milieus" rel="noopener" title="Sinus-Milieus (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Sinus-Milieus (Wikipedia)</span></a></p>

ng im 19. Jahrhundert, Mitte des 20. Jahrhunderts, ab den 1980ern.","links":[{"title":"Sozialstruktur (Wikipedia)","url":"https://de.wikipedia.org/wiki/Sozialstruktur"}],"type":"ordering","items":["Ständegesellschaft","Klassengesellschaft","Schichtgesellschaft","Sozialmilieus"]},"rendered":{}}},{"key":"a3","ref":"/modelle/klassentheorie-marx/#trennlinie","page":"modelle/klassentheorie-marx/","exercise":"trennlinie","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a3","text":"Was trennt nach Marx die beiden Klassen?","explanation":"Wer die Produktionsmittel besitzt, gehört zur Bourgeoisie; wer seine Arbeitskraft verkaufen muss, zum Proletariat.","links":[{"title":"Klassentheorie (Wikipedia)","url":"https://de.wikipedia.org/wiki/Klassentheorie"}],"type":"single-choice","options":[{"text":"der Besitz an Produktionsmitteln","correct":true,"info":"Die Bourgeoisie besitzt Fabriken und Maschinen, das Proletariat nur seine Arbeitskraft."},{"text":"die Geburt in einen Stand","correct":false,"info":"Das gilt für die Ständegesellschaft des Mittelalters."},{"text":"der Lebensstil und die Werte","correct":false,"info":"Lebensstil und Werte stehen bei den Milieus im Mittelpunkt."}]},"rendered":{}}},{"key":"a4","ref":"/modelle/klassentheorie-marx/#kette-ordnen","page":"modelle/klassentheorie-marx/","exercise":"kette-ordnen","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a4","text":"Bring die Gedankenkette von Marx in die richtige Reihenfolge.","explanation":"Abhängigkeit → Verelendung → Klassenbewusstsein → Klassenkampf und Revolution.","links":[{"title":"Klassenkampf (Wikipedia)","url":"https://de.wikipedia.org/wiki/Klassenkampf"}],"type":"ordering","items":["Die Lohnarbeiter müssen ihre Arbeitskraft an die Besitzer verkaufen.","Konkurrenz und Lohndruck führen zur Verelendung der Arbeiter.","Die Arbeiter werden sich ihrer Lage bewusst und organisieren sich.","Im Klassenkampf beseitigt eine Revolution das Privateigentum an Produktionsmitteln."]},"rendered":{}}},{"key":"a5","ref":"/modelle/klassengesellschaft-heute/#argumente-dafuer","page":"modelle/klassengesellschaft-heute/","exercise":"argumente-dafuer","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a5","text":"Welche Aussagen sprechen für eine neue Klassengesellschaft?","explanation":"Dafür sprechen dauerhafte, vererbte Benachteiligungen; dagegen Wohlstand, Vielfalt und Sozialstaat.","links":[{"title":"Klassengesellschaft (Wikipedia)","url":"https://de.wikipedia.org/wiki/Klassengesellschaft"}],"type":"multiple-choice","options":[{"text":"57 % der Erwerbslosen sind von Armut bedroht.","correct":true,"info":"Eine Gruppe ist dauerhaft benachteiligt – das stützt das Klassenmodell."},{"text":"Die soziale Auslese beginnt schon nach der Grundschule.","correct":true,"info":"Wenn Herkunft früh über den Weg entscheidet, wird Ungleichheit vererbt."},{"text":"Auch die Unterschicht hat vom wachsenden Wohlstand profitiert.","correct":false,"info":"Das spricht dagegen – es gibt keine Verelendung wie bei Marx."},{"text":"Lebensstil und Engagement bestimmen die Position mit.","correct":false,"info":"Das spricht dagegen – nicht nur Besitz zählt."}]},"rendered":{}}},{"key":"a6","ref":"/modelle/klassengesellschaft-heute/#erwerbslose-quote","page":"modelle/klassengesellschaft-heute/","exercise":"erwerbslose-quote","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a6","text":"Wie viel Prozent der Erwerbslosen sind laut einem Argument der Debatte von Armut bedroht?","explanation":"Mehr als die Hälfte der Erwerbslosen ist armutsgefährdet – ein Argument für dauerhafte, strukturelle Ungleichheit.","links":[{"title":"Armut in Deutschland (Wikipedia)","url":"https://de.wikipedia.org/wiki/Armut_in_Deutschland"}],"type":"number","answer":57,"tolerance":0,"unit":"%","mistakes":[{"answer":42.7,"message":"Das ist der Wert für Alleinerziehende. Gefragt sind die Erwerbslosen."},{"answer":35,"message":"Das ist der Wert für Nichtdeutsche. Gefragt sind die Erwerbslosen."}]},"rendered":{}}},{"key":"a7","ref":"/modelle/schichtmodelle/#dahrendorf-begriffe","page":"modelle/schichtmodelle/","exercise":"dahrendorf-begriffe","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a7","text":"Wer gehört bei Dahrendorf wohin? Ordne zu.","explanation":"Der „falsche Mittelstand“ fühlt sich zur Mitte gehörig, steht sozial aber den Arbeitern nahe.","links":[{"title":"Ralf Dahrendorf (Wikipedia)","url":"https://de.wikipedia.org/wiki/Ralf_Dahrendorf"}],"type":"matching","pairs":[{"left":"Dienstklasse","right":"Verwaltungsangestellte"},{"left":"falscher Mittelstand","right":"einfache Dienstleistungsberufe"},{"left":"Arbeiterelite","right":"Meister"},{"left":"Eliten","right":"Machteliten in Politik, Wirtschaft, Medien"}],"distractors":["Landwirte"]},"rendered":{}}},{"key":"a8","ref":"/modelle/schichtmodelle/#unterschichtung","page":"modelle/schichtmodelle/","exercise":"unterschichtung","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a8","text":"Was meint Geißler mit „Unterschichtung“?","explanation":"Unterschichtung heißt, dass eine neue Gruppe unten in die Sozialstruktur eintritt.","links":[{"title":"Rainer Geißler (Wikipedia)","url":"https://de.wikipedia.org/wiki/Rainer_Gei%C3%9Fler"}],"type":"single-choice","options":[{"text":"Migrantinnen und Migranten sind in den unteren Etagen viel stärker vertreten als oben.","correct":true,"info":"Viele Zugewanderte arbeiten in einfachen Berufen und schieben sich unter die einheimische Bevölkerung."},{"text":"Die Unterschicht ist verschwunden.","correct":false,"info":"Die Unterschicht gibt es weiter, mit etwa 6 %."},{"text":"Alle Schichten sind gleich groß geworden.","correct":false,"info":"Die Schichten sind weiter sehr verschieden groß."}]},"rendered":{}}},{"key":"a9","ref":"/modelle/soziale-milieus/#milieu-zuordnen","page":"modelle/soziale-milieus/","exercise":"milieu-zuordnen","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a9","text":"Welche Beschreibung passt zu welchem Milieu? Ein Milieu bleibt übrig.","explanation":"Lage und Werte zusammen machen ein Milieu aus.","links":[{"title":"Sinus-Milieus (Wikipedia)","url":"https://de.wikipedia.org/wiki/Sinus-Milieus"}],"type":"matching","pairs":[{"left":"Gut gebildet, engagiert für Gemeinwohl, Nachhaltigkeit und Vielfalt.","right":"Postmaterielles Milieu"},{"left":"Ältere Generation, liebt Sicherheit und Ordnung, eher kleinbürgerlich.","right":"Traditionelles Milieu"},{"left":"Jung, urban, digital, kreativ, sucht neue und ungewöhnliche Erfahrungen.","right":"Expeditives Milieu"},{"left":"Möchte dazugehören, kämpft mit Benachteiligungen und um Teilhabe.","right":"Prekäres Milieu"}],"distractors":["Milieu der Performer"]},"rendered":{}}},{"key":"a10","ref":"/modelle/soziale-milieus/#scharfe-grenzen","page":"modelle/soziale-milieus/","exercise":"scharfe-grenzen","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a10","text":"Zwischen den Milieus gibt es scharfe Grenzen.","explanation":"Die Übergänge sind fließend. Darum überlappen sich die Felder in Milieu-Grafiken.","links":[{"title":"Sinus-Milieus (Wikipedia)","url":"https://de.wikipedia.org/wiki/Sinus-Milieus"}],"type":"true-false","answer":false},"rendered":{}}},{"key":"a11","ref":"/modelle/individualisierung-und-singularitaet/#these-autor","page":"modelle/individualisierung-und-singularitaet/","exercise":"these-autor","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a11","text":"Wer sagt was? Ordne zu. Ein Name bleibt übrig.","explanation":"Beck – Individualisierung; Reckwitz – Singularisierung; Mau – Kritik an Reckwitz.","links":[{"title":"Andreas Reckwitz (Wikipedia)","url":"https://de.wikipedia.org/wiki/Andreas_Reckwitz"}],"type":"matching","pairs":[{"left":"Menschen werden weniger durch Familie, Religion und Klasse geprägt und gestalten ihr Leben selbst.","right":"Beck"},{"left":"Geschätzt wird das Einzigartige; die akademische Mittelklasse steigt auf, die alte steigt ab.","right":"Reckwitz"},{"left":"Das Modell setzt Klasse und Kultur zu schnell gleich.","right":"Mau"}],"distractors":["Marx"]},"rendered":{}}},{"key":"a12","ref":"/modelle/individualisierung-und-singularitaet/#wahlbiografie","page":"modelle/individualisierung-und-singularitaet/","exercise":"wahlbiografie","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a12","text":"Was meint Beck mit „Wahlbiografie“?","explanation":"Individualisierung bedeutet Freiheit – aber auch den Zwang, selbst zu wählen.","links":[{"title":"Ulrich Beck (Wikipedia)","url":"https://de.wikipedia.org/wiki/Ulrich_Beck"}],"type":"single-choice","options":[{"text":"Den Lebensweg gibt nicht mehr die Herkunft vor – man muss ihn selbst gestalten.","correct":true,"info":"Früher war vieles vorgegeben (die „Normalbiografie“), heute muss man selbst entscheiden."},{"text":"Jeder darf bei Wahlen seine Partei wählen.","correct":false,"info":"Es geht nicht um politische Wahlen, sondern um Lebensentscheidungen."},{"text":"Die Biografie wird von der Familie festgelegt.","correct":false,"info":"Das ist gerade das Gegenteil – die Familie gibt weniger vor."}]},"rendered":{}}},{"key":"a13","ref":"/modelle/gespaltene-gesellschaft/#quadrant-zuordnen","page":"modelle/gespaltene-gesellschaft/","exercise":"quadrant-zuordnen","step":4,"data":{"kind":"question","lang":"de","question":{"id":"a13","text":"Wo liegen die Parteifamilien? Ordne zu.","explanation":"Die zweite Achse trennt Parteien, die auf der Links-Rechts-Achse nah beieinander liegen.","links":[{"title":"Wolfgang Merkel (Wikipedia)","url":"https://de.wikipedia.org/wiki/Wolfgang_Merkel"}],"type":"matching","pairs":[{"left":"links und kosmopolitisch","right":"Grüne"},{"left":"rechts und kosmopolitisch","right":"Liberale"},{"left":"links und kommunitaristisch","right":"Linkspopulisten"},{"left":"rechts und kommunitaristisch","right":"Rechtspopulisten"}]},"rendered":{}}},{"key":"a14","ref":"/modelle/gespaltene-gesellschaft/#kosmopoliten","page":"modelle/gespaltene-gesellschaft/","exercise":"kosmopoliten","step":4,"data":{"kind":"question","lang":"de","question":{"id":"a14","text":"Was kennzeichnet Kosmopoliten nach Merkel?","explanation":"Kosmopoliten sind gebildet, mobil, offen – und profitieren von der Globalisierung.","links":[{"title":"Kosmopolitismus (Wikipedia)","url":"https://de.wikipedia.org/wiki/Kosmopolitismus"}],"type":"multiple-choice","options":[{"text":"überdurchschnittliche Bildung und Einkommen","correct":true,"info":"Sie haben viel Human- und kulturelles Kapital."},{"text":"räumlich und beruflich mobil","correct":true,"info":"Sie leben und arbeiten oft über Grenzen hinweg."},{"text":"Vorliebe für eng kontrollierte nationale Grenzen","correct":false,"info":"Das kennzeichnet Kommunitaristen."},{"text":"eher Verlierer der Globalisierung","correct":false,"info":"Kosmopoliten gelten als Gewinner der Globalisierung."}]},"rendered":{}}}],"pages":[{"page":"modelle/modelle-im-ueberblick/","title":"Modelle im Überblick","href":"../../modelle/modelle-im-ueberblick/"},{"page":"modelle/klassentheorie-marx/","title":"Klassentheorie nach Marx","href":"../../modelle/klassentheorie-marx/"},{"page":"modelle/klassengesellschaft-heute/","title":"Klassengesellschaft heute?","href":"../../modelle/klassengesellschaft-heute/"},{"page":"modelle/schichtmodelle/","title":"Schichtmodelle","href":"../../modelle/schichtmodelle/"},{"page":"modelle/soziale-milieus/","title":"Soziale Milieus","href":"../../modelle/soziale-milieus/"},{"page":"modelle/individualisierung-und-singularitaet/","title":"Beck und Reckwitz","href":"../../modelle/individualisierung-und-singularitaet/"},{"page":"modelle/gespaltene-gesellschaft/","title":"Gespaltene Gesellschaft?","href":"../../modelle/gespaltene-gesellschaft/"}],"chapters":[{"title":"Politik verstehen","assessment":"politik/einschaetzung/","pages":[{"title":"Politisch oder nicht?","local":"politik/politisch-oder-nicht/"},{"title":"Politikbegriffe","local":"politik/politikbegriffe/"},{"title":"poli
