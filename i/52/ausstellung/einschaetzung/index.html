<script type="application/json" class="explainer-assessment-data">{"key":"self-assessment:ausstellung","storage":"explainer","steps":7,"items":[{"key":"a1","ref":"/ausstellung/programmmusik/#rollen","page":"ausstellung/programmmusik/","exercise":"rollen","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a1","text":"Ordne die drei Personen ihren Rollen zu.","explanation":"Mussorgski setzte Bilder Hartmanns in Klaviermusik um. Ravel gab dieser Musik später Orchesterklang.","links":[{"title":"Hörführer des Philharmonia Orchestra (Englisch)","url":"https://philharmonia.co.uk/pictures-at-an-exhibition-listening-guide/"}],"type":"matching","pairs":[{"left":"Hartmann","right":"Bilder und Entwürfe"},{"left":"Mussorgski","right":"Ursprüngliche Klavierkomposition"},{"left":"Ravel","right":"Spätere Orchesterbearbeitung"}]},"rendered":{}}},{"key":"a2","ref":"/ausstellung/programmmusik/#programm-erklaeren","page":"ausstellung/programmmusik/","exercise":"programm-erklaeren","step":0,"data":{"kind":"open","lang":"de","id":"programm-erklaeren","task":"\u003cp>Erkläre in zwei bis drei Sätzen, warum „Bilder einer Ausstellung“ Programmmusik ist.\u003c/p>","answer":["text","photo"],"points":[{"text":"Es ist Instrumentalmusik, die sich auf Bilder oder Szenen bezieht.","kind":"content","href":"../../ausstellung/programmmusik/#regel"},{"text":"Mussorgski übertrug Eindrücke von Hartmanns Bildern in Musik.","kind":"content","href":"../../ausstellung/programmmusik/#beispiel"}],"solution":"\u003cp>Die Stücke stellen Bilder und Szenen mit Instrumenten dar. Mussorgski ließ sich von Bildern Hartmanns anregen und machte daraus Klaviermusik. Deshalb gehört der Zyklus zur Programmmusik.\u003c/p>"}},{"key":"a3","ref":"/ausstellung/promenade/#promenade-folgen","page":"ausstellung/promenade/","exercise":"promenade-folgen","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a3","text":"Ordne die Aussagen zur Promenade den Begriffen zu.","explanation":"Die Promenade verbindet Wiederkehr und Veränderung mit der Vorstellung eines Spaziergangs.","links":[{"title":"Hörführer des Philharmonia Orchestra (Englisch)","url":"https://philharmonia.co.uk/pictures-at-an-exhibition-listening-guide/"}],"type":"matching","pairs":[{"left":"Das Thema ist wiederzuerkennen.","right":"Wiederkehr"},{"left":"Besetzung oder Stimmung wechseln.","right":"Veränderung"},{"left":"Der Betrachter geht zum nächsten Bild.","right":"Außermusikalischer Inhalt"}]},"rendered":{}}},{"key":"a4","ref":"/ausstellung/promenade/#promenade-aenderung","page":"ausstellung/promenade/","exercise":"promenade-aenderung","step":1,"data":{"kind":"open","lang":"de","id":"promenade-aenderung","task":"\u003cp>Erkläre in zwei bis drei Sätzen, warum eine wiederkehrende Promenade trotzdem unterschiedlich klingen kann.\u003c/p>","answer":["text","photo"],"points":[{"text":"Das Thema bleibt als Promenade wiedererkennbar.","kind":"content","href":"../../ausstellung/promenade/#regel"},{"text":"Instrumente und Stimmung können wechseln; in der ersten Ravel-Promenade beginnt die Trompete.","kind":"content","href":"../../ausstellung/promenade/#beispiel"}],"solution":"\u003cp>Die Promenade stellt den Gang zwischen den Bildern dar. Ihr Thema kehrt wieder, kann aber von anderen Instrumenten und mit anderer Stimmung gespielt werden. In Ravels erster Promenade beginnt zum Beispiel eine Trompete.\u003c/p>"}},{"key":"a5","ref":"/ausstellung/schloss/#klang","page":"ausstellung/schloss/","exercise":"klang","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a5","text":"Welches Instrument trägt in Ravels Fassung die Melodie von „Das alte Schloss“?","explanation":"Das Altsaxofon trägt in Ravels Fassung die Melodie des Alten Schlosses; die Tuba ist dagegen ein wichtiges Merkmal von Bydło.","links":[{"title":"Hörführer des Philharmonia Orchestra (Englisch)","url":"https://philharmonia.co.uk/pictures-at-an-exhibition-listening-guide/"}],"type":"single-choice","options":[{"text":"Altsaxofon","correct":true,"info":"Das Altsaxofon trägt in Ravels Fassung die Melodie des Alten Schlosses; die Tuba ist dagegen ein wichtiges Merkmal von Bydło."},{"text":"Tuba","correct":false,"info":"Das Altsaxofon trägt in Ravels Fassung die Melodie des Alten Schlosses; die Tuba ist dagegen ein wichtiges Merkmal von Bydło."},{"text":"Klavier allein","correct":false,"info":"Mussorgskis ursprünglicher Zyklus war für Klavier. Gefragt ist hier nach einem Klangmerkmal der Orchesterfassung."}]},"rendered":{}}},{"key":"a6","ref":"/ausstellung/schloss/#beschreiben","page":"ausstellung/schloss/","exercise":"beschreiben","step":2,"data":{"kind":"open","lang":"de","id":"beschreiben","task":"\u003cp>Beschreibe „Das alte Schloss“ nach dem Hören in zwei bis vier Sätzen. Nenne die Szene und mindestens zwei passende musikalische Merkmale.\u003c/p>","answer":["text","photo"],"points":[{"text":"Vor einem alten Schloss singt ein Troubadour, ein Sänger.","kind":"content","href":"../../ausstellung/schloss/#regel"},{"text":"Du beschreibst eine ruhige, singende Melodie über einer getragenen Begleitung.","kind":"content","href":"../../ausstellung/schloss/#regel"},{"text":"Du benennst als Klangmerkmal Altsaxofon.","kind":"content","href":"../../ausstellung/schloss/#regel"}],"solution":"\u003cp>Die Musik wirkt ruhig und nachdenklich. Das Altsaxofon spielt in Ravels Fassung eine lange, singende Melodie, die zu einem Sänger vor dem Schloss passt.\u003c/p>"}},{"key":"a7","ref":"/ausstellung/ochsenkarren/#klang","page":"ausstellung/ochsenkarren/","exercise":"klang","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a7","text":"Welches Instrument trägt in Ravels Fassung die Melodie von „Bydło – der Ochsenkarren“?","explanation":"Die Tuba gibt Bydło seine tiefe Klangfarbe. Ein Saxofonsolo kennzeichnet dagegen das Alte Schloss.","links":[{"title":"Hörführer des Philharmonia Orchestra (Englisch)","url":"https://philharmonia.co.uk/pictures-at-an-exhibition-listening-guide/"}],"type":"single-choice","options":[{"text":"Tuba","correct":true,"info":"Die Tuba gibt Bydło seine tiefe Klangfarbe. Ein Saxofonsolo kennzeichnet dagegen das Alte Schloss."},{"text":"Altsaxofon","correct":false,"info":"Die Tuba gibt Bydło seine tiefe Klangfarbe. Ein Saxofonsolo kennzeichnet dagegen das Alte Schloss."},{"text":"Klavier allein","correct":false,"info":"Mussorgskis ursprünglicher Zyklus war für Klavier. Gefragt ist hier nach einem Klangmerkmal der Orchesterfassung."}]},"rendered":{}}},{"key":"a8","ref":"/ausstellung/ochsenkarren/#beschreiben","page":"ausstellung/ochsenkarren/","exercise":"beschreiben","step":3,"data":{"kind":"open","lang":"de","id":"beschreiben","task":"\u003cp>Beschreibe „Bydło – der Ochsenkarren“ nach dem Hören in zwei bis vier Sätzen. Nenne die Szene und mindestens zwei passende musikalische Merkmale.\u003c/p>","answer":["text","photo"],"points":[{"text":"Zwei Ochsen ziehen einen schweren Wagen.","kind":"content","href":"../../ausstellung/ochsenkarren/#regel"},{"text":"Du beschreibst den schweren Schritt und den Verlauf leise – lauter – wieder leiser in Ravels Fassung.","kind":"content","href":"../../ausstellung/ochsenkarren/#regel"},{"text":"Du benennst als Klangmerkmal Tuba.","kind":"content","href":"../../ausstellung/ochsenkarren/#regel"}],"solution":"\u003cp>Ein tiefer Tubaklang und gleichmäßige Schritte lassen den Wagen schwer wirken. In dieser Ravel-Aufnahme wird die Musik beim Näherkommen lauter und beim Entfernen wieder leiser.\u003c/p>"}},{"key":"a9","ref":"/ausstellung/tuilerien/#klang","page":"ausstellung/tuilerien/","exercise":"klang","step":4,"data":{"kind":"question","lang":"de","question":{"id":"a9","text":"Welche Besetzung nennt die Beschreibung des verlinkten Tuilerien-Videos?","explanation":"Die Videobeschreibung nennt eine Fassung für Streichorchester. Das Saxofonsolo gehört zum Alten Schloss; Holzbläser sind bei den Tuilerien ein Merkmal der Ravel-Fassung, nicht dieser Aufnahme.","links":[{"title":"Hörführer des Philharmonia Orchestra (Englisch)","url":"https://philharmonia.co.uk/pictures-at-an-exhibition-listening-guide/"}],"type":"single-choice","options":[{"text":"Streichorchester","correct":true,"info":"Die Videobeschreibung nennt eine Fassung für Streichorchester. Das Saxofonsolo gehört zum Alten Schloss; Holzbläser sind bei den Tuilerien ein Merkmal der Ravel-Fassung, nicht dieser Aufnahme."},{"text":"Altsaxofon als Soloinstrument","correct":false,"info":"Die Videobeschreibung nennt eine Fassung für Streichorchester. Das Saxofonsolo gehört zum Alten Schloss; Holzbläser sind bei den Tuilerien ein Merkmal der Ravel-Fassung, nicht dieser Aufnahme."},{"text":"Holzbläserensemble","correct":false,"info":"Bewegte Holzbläser kennzeichnen Ravels Orchesterfassung. Euer Link ist ausdrücklich für Streichorchester."}]},"rendered":{}}},{"key":"a10","ref":"/ausstellung/tuilerien/#beschreiben","page":"ausstellung/tuilerien/","exercise":"beschreiben","step":4,"data":{"kind":"open","lang":"de","id":"beschreiben","task":"\u003cp>Beschreibe „Die Tuilerien – Kinder im Streit“ nach dem Hören in zwei bis vier Sätzen. Nenne die Szene und mindestens zwei passende musikalische Merkmale.\u003c/p>","answer":["text","photo"],"points":[{"text":"Kinder spielen und streiten in einem Park in Paris.","kind":"content","href":"../../ausstellung/tuilerien/#regel"},{"text":"Du verbindest die lebhaften, kurzen Gesten mit spielenden oder streitenden Kindern und benennst die Streicher dieser Aufnahme.","kind":"content","href":"../../ausstellung/tuilerien/#regel"},{"text":"Du benennst als Klangmerkmal Streichorchester.","kind":"content","href":"../../ausstellung/tuilerien/#regel"}],"solution":"\u003cp>Die Musik ist lebhaft und besteht aus kurzen, rufartigen Gesten. Das passt zu Kindern beim Spielen und Streiten. In unserem verlinkten Video spielen Streicher; die Holzbläserbeschreibung gilt für Ravels andere Fassung.\u003c/p>"}},{"key":"a11","ref":"/ausstellung/goldenberg/#klang","page":"ausstellung/goldenberg/","exercise":"klang","step":5,"data":{"kind":"question","lang":"de","question":{"id":"a11","text":"Welches Instrument spielt Schmuÿles hohen, wiederholenden Gedanken in Ravels Fassung?","explanation":"Die gedämpfte Trompete zeichnet Schmuÿles hohen, wiederholenden Gedanken. Das Altsaxofon kennzeichnet das Alte Schloss.","links":[{"title":"Hörführer des Philharmonia Orchestra (Englisch)","url":"https://philharmonia.co.uk/pictures-at-an-exhibition-listening-guide/"}],"type":"single-choice","options":[{"text":"Gedämpfte Trompete","correct":true,"info":"Die gedämpfte Trompete zeichnet Schmuÿles hohen, wiederholenden Gedanken. Das Altsaxofon kennzeichnet das Alte Schloss."},{"text":"Altsaxofon","correct":false,"info":"Die gedämpfte Trompete zeichnet Schmuÿles hohen, wiederholenden Gedanken. Das Altsaxofon kennzeichnet das Alte Schloss."},{"text":"Klavier allein","correct":false,"info":"Mussorgskis ursprünglicher Zyklus war für Klavier. Gefragt ist hier nach einem Klangmerkmal der Orchesterfassung."}]},"rendered":{}}},{"key":"a12","ref":"/ausstellung/goldenberg/#beschreiben","page":"ausstellung/goldenberg/","exercise":"beschreiben","step":5,"data":{"kind":"open","lang":"de","id":"beschreiben","task":"\u003cp>Beschreibe „Samuel Goldenberg und Schmuÿle“ nach dem Hören in zwei bis vier Sätzen. Nenne die Szene und mindestens zwei passende musikalische Merkmale.\u003c/p>","answer":["text","photo"],"points":[{"text":"Zwei sehr unterschiedliche Personen werden musikalisch gegenübergestellt: Samuel Goldenberg und Schmuÿle.","kind":"content","href":"../../ausstellung/goldenberg/#regel"},{"text":"Du beschreibst den Gegensatz zwischen einem kräftigen breiten und einem hohen, wiederholenden Gedanken.","kind":"content","href":"../../ausstellung/goldenberg/#regel"},{"text":"Du benennst als Klangmerkmal Gedämpfte Trompete.","kind":"content","href":"../../ausstellung/goldenberg/#regel"}],"solution":"\u003cp>Die beiden Personen haben unterschiedliche musikalische Gedanken. Der erste klingt kräftig und breit; der andere hoch und wiederholend auf einer gedämpften Trompete. Durch den Gegensatz kann ich die Figuren unterscheiden.\u003c/p>"}},{"key":"a13","ref":"/ausstellung/hoervergleich/#instrumente","page":"ausstellung/hoervergleich/","exercise":"instrumente","step":6,"data":{"kind":"question","lang":"de","question":{"id":"a13","text":"Ordne die Klanghinweise zu. Tuilerien meint hier das verlinkte Streicharrangement; die übrigen Hinweise beziehen sich auf Ravel.","explanation":"Instrumente helfen beim Wiedererkennen. Die Tuilerien-Aufnahme ist anders besetzt als Ravels Fassung.","links":[{"title":"Hörführer des Philharmonia Orchestra (Englisch)","url":"https://philharmonia.co.uk/pictures-at-an-exhibition-listening-guide/"}],"type":"matching","pairs":[{"left":"Singende Altsaxofonmelodie","right":"Das alte Schloss"},{"left":"Tiefe Tubamelodie","right":"Bydło"},{"left":"Lebhafte Streicher im Unterrichtsvideo","right":"Tuilerien"},{"left":"Hohe wiederholende gedämpfte Trompete","right":"Schmuÿle"}]},"rendered":{}}},{"key":"a14","ref":"/ausstellung/hoervergleich/#vergleichen","page":"ausstellung/hoervergleich/","exercise":"vergleichen","step":6,"data":{"kind":"open","lang":"de","id":"vergleichen","task":"\u003cp>Vergleiche das Alte Schloss und den Ochsenkarren in drei bis vier Sätzen. Nenne zu jedem Stück Szene und Instrument und beschreibe einen Unterschied in der Wirkung.\u003c/p>","answer":["text","photo"],"points":[{"text":"Beim Alten Schloss passen Sänger und Altsaxofon zur ruhigen, singenden Melodie.","kind":"content","href":"../../ausstellung/schloss/#regel"},{"text":"Bei Bydło passen Ochsenkarren und Tuba zum schweren Schritt.","kind":"content","href":"../../ausstellung/ochsenkarren/#regel"},{"text":"Der Gegensatz wird mit musikalischen Merkmalen begründet.","kind":"content","href":"../../ausstellung/hoervergleich/#regel"}],"solution":"\u003cp>Beim Alten Schloss höre ich eine ruhige, singende Melodie des Altsaxofons, passend zu einem Sänger. Im Ochsenkarren klingt die Tuba tief und die Begleitung schreitet schwer voran. In Ravels Fassung wird der Wagen beim Näherkommen lauter. Das Schloss wirkt dadurch eher ruhig, der Wagen schwer und bewegt.\u003c/p>"}}],"pages":[{"page":"ausstellung/programmmusik/","title":"Wenn Musik Bilder erzählt","href":"../../ausstellung/programmmusik/"},{"page":"ausstellung/promenade/","title":"Die Promenade: von Bild zu Bild","href":"../../ausstellung/promenade/"},{"page":"ausstellung/schloss/","title":"Das alte Schloss","href":"../../ausstellung/schloss/"},{"page":"ausstellung/ochsenkarren/","title":"Bydło – der Ochsenkarren","href":"../../ausstellung/ochsenkarren/"},{"page":"ausstellung/tuilerien/","title":"Die Tuilerien – Kinder im Streit","href":"../../ausstellung/tuilerien/"},{"page":"ausstellung/goldenberg/","title":"Samuel Goldenberg und Schmuÿle","href":"../../ausstellung/goldenberg/"},{"page":"ausstellung/hoervergleich/","title":"Vier Hörbilder vergleichen","href":"../../ausstellung/hoervergleich/"}],"chapters":[{"title":"Dur und Moll","assessment":"tonleitern/einschaetzung/","pages":[{"title":"Ganzton, Halbton und Vorzeichen","local":"tonleitern/schritte/"},{"title":"Durtonleitern bauen","local":"tonleitern/dur/"},{"title":"Natürliche Molltonleitern bauen","local":"tonleitern/moll/"}]},{"title":"Bilder einer Ausstellung","assessment":"ausstellung/einschaetzung/","pages":[{"title":"Wenn Musik Bilder erzählt","local":"ausstellung/programmmusik/"},{"title":"Die Promenade: von Bild zu Bild","local":"ausstellung/promenade/"},{"title":"Das alte Schloss","local":"ausstellung/schloss/"},{"title":"Bydło – der Ochsenkarren","local":"ausstellung/ochsenkarren/"},{"title":"Die Tuilerien – Kinder im Streit","local":"ausstellung/tuilerien/"},{"title":"Samuel Goldenberg und Schmuÿle","local":"ausstellung/goldenberg/"},{"title":"Vier Hörbilder vergleichen","local":"ausstellung/hoervergleich/"}]}],"whole":"einschaetzung/","root":"../../","tutor":"ausstellung/einschaetzung/tutor/","markdown":"ausstellung/einschaetzung/tuto
