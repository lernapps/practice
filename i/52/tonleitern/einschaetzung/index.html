<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedem Tonpaar den Abstand zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>e – f</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">2 Halbtonschritte</option><option value="0">1 Halbtonschritt</option><option value="2">3 Halbtonschritte</option></select></label></li>
<li><label><span>c – d</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">2 Halbtonschritte</option><option value="0">1 Halbtonschritt</option><option value="2">3 Halbtonschritte</option></select></label></li>
<li><label><span>c – es</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">2 Halbtonschritte</option><option value="0">1 Halbtonschritt</option><option value="2">3 Halbtonschritte</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> e – f – 1 Halbtonschritt; c – d – 2 Halbtonschritte; c – es – 3 Halbtonschritte</p>
<p class="question-explanation">Zwischen e und f liegt kein weiterer Ton. Von c nach d sind es zwei Halbtöne; von c über cis und d nach es drei.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://open-musictheory.github.io/docs/fundamentals/scales/" rel="noopener">Tonleitern erklärt: Open Music Theory (Englisch)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>

<p class="question-explanation">Ein Ganzton ist die Summe aus zwei Halbtonschritten.</p>

<ul class="question-links">
<li><a href="https://open-musictheory.github.io/docs/fundamentals/scales/" rel="noopener">Tonleitern erklärt: Open Music Theory (Englisch)</a></li>
