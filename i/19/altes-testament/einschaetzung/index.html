<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../altes-testament/">Das Alte Testament</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Paare sind Erzeltern?</legend>
<label class="question-option"><input type="checkbox" name="frage-a1" value="0"> <span>Abraham und Sara</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="1"> <span>Isaak und Rebekka</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="2"> <span>Adam und Eva</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Abraham und Sara</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Abraham ist der erste Erzvater, Sara seine Frau.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Isaak und Rebekka</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Isaak ist der Sohn von Abraham und Sara.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Adam und Eva</strong></p><p>Adam und Eva kommen in der Schöpfungserzählung am Anfang der Bibel vor.</p></li>
</ul>
<p class="question-explanation">Zu den Erzeltern zählen Abraham und Sara sowie Isaak und Rebekka.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Abraham" rel="noopener">Abraham (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wer führt das Volk Israel in das verheißene Land?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Josua</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Mose</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Jakob</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Josua</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Josua ist der Nachfolger des Mose.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Mose</strong></p><p>Mose stirbt auf dem Berg Nebo, bevor das Volk ins Land zieht.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Jakob</strong></p><p>Jakob lebte lange vor dem Auszug aus Ägypten.</p></li>
</ul>
<p class="question-explanation">Josua führt das Volk, nicht Mose.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Josua" rel="noopener">Josua (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Von wie vielen Söhnen Jakobs leiten sich die Stämme Israels ab?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a3" aria-describedby="frage-a3-unit"> <span id="frage-a3-unit">Söhne</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 12 Söhne</p>
<p class="question-explanation">Nach der Bibel hat Jakob zwölf Söhne. Von ihnen stammen die zwölf Stämme.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Zw%C3%B6lf_St%C3%A4mme_Israels" rel="noopener">Zwölf Stämme Israels (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie viele Schriften hat das Neue Testament?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a4" aria-describedby="frage-a4-unit"> <span id="frage-a4-unit">Schriften</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 27 Schriften</p>
<p class="question-explanation">Das Neue Testament hat 27 Schriften.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Altes_Testament" rel="noopener">Altes Testament (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie viele Bücher hat der Tanach nach jüdischer Zählung?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>24</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>39</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>46</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>24</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Tanach hat 24 Bücher.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>39</strong></p><p>So viele Bücher hat das Alte Testament nach evangelischer Zählung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>46</strong></p><p>So viele Bücher hat das Alte Testament nach katholischer Zählung.</p></li>
</ul>
<p class="question-explanation">Der Tanach zählt 24 Bücher. Die Anordnung und die Zählung sind andere als im Alten Testament.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Tanach" rel="noopener">Tanach (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Bücher gehören zum Pentateuch?</legend>
<label class="question-option"><input type="checkbox" name="frage-a6" value="0"> <span>Genesis</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="1"> <span>Levitikus</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="2"> <span>Psalmen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="3"> <span>Apostelgeschichte</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Genesis</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Genesis ist das erste Buch der Bibel.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Levitikus</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Levitikus ist das 3. Buch Mose.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Psalmen</strong></p><p>Die Psalmen sind Gebete und Lieder.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Apostelgeschichte</strong></p><p>Sie gehört zum Neuen Testament.</p></li>
</ul>
<p class="question-explanation">Der Pentateuch umfasst die fünf Bücher Mose, von Genesis bis Deuteronomium.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Pentateuch" rel="noopener">Pentateuch (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
