<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../synagoge/">Die Synagoge</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 3 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 1</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was bedeutet das Wort „Synagoge“?</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Versammlung</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Opferstätte</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Heiliger Berg</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Versammlung</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Wort kommt aus dem Griechischen: Hier versammelt sich die Gemeinde.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Opferstätte</strong></p><p>Geopfert wurde im Tempel in Jerusalem, nicht in der Synagoge.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Heiliger Berg</strong></p><p>Das Wort hat nichts mit einem Berg zu tun.</p></li>
</ul>
<p class="question-explanation">Synagoge ist griechisch für „Versammlung“. Dort treffen sich Menschen zu Gebet und Lernen.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Synagoge" rel="noopener">Synagoge (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wohin ist der Toraschrein in einer Synagoge ausgerichtet?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Nach Jerusalem</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Nach Bethlehem</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Nach Rom</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Nach Jerusalem</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Toraschrein steht an der Wand, die in Richtung Jerusalem zeigt. Das ist im Beispiel die Ostwand.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Nach Bethlehem</strong></p><p>Bethlehem ist für Christen wichtig, weil dort Jesus geboren wurde.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nach Rom</strong></p><p>Rom ist ein Zentrum der katholischen Kirche, nicht des Judentums.</p></li>
</ul>
<p class="question-explanation">Beim Beten blicken Juden nach Jerusalem. Darum steht der Toraschrein auf dieser Seite.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Synagoge" rel="noopener">Synagoge (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedem Buchstaben im Grundriss das richtige Teil der Synagoge zu.</legend>
<div class="question-material"><figure class="block-figure block-labelled"><div class="block-labelled-image block-labelled-fill"><img src="../../images/grundriss-synagoge.svg" alt="Grundriss einer Synagoge, Osten oben, mit den Markern A bis E. A: Toraschrein, B: Menora, C: Ewiges Licht, D: Lesepult, E: Frauenempore." loading="lazy" decoding="async"><span class="block-marker" style="left: 50%; top: 15%" aria-hidden="true">A</span><span class="block-marker" style="left: 27%; top: 14%" aria-hidden="true">B</span><span class="block-marker" style="left: 50%; top: 21%" aria-hidden="true">C</span><span class="block-marker" style="left: 50%; top: 50%" aria-hidden="true">D</span><span class="block-marker" style="left: 13%; top: 54%" aria-hidden="true">E</span></div><figcaption><p>Welcher Buchstabe steht für welches Teil?</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>A</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="2">Ewiges Licht</option><option value="4">Frauenempore</option><option value="0">Toraschrein</option><option value="3">Lesepult</option><option value="1">Menora</option></select></label></li>
<li><label><span>B</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="2">Ewiges Licht</option><option value="4">Frauenempore</option><option value="0">Toraschrein</option><option value="3">Lesepult</option><option value="1">Menora</option></select></label></li>
<li><label><span>C</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="2">Ewiges Licht</option><option value="4">Frauenempore</option><option value="0">Toraschrein</option><option value="3">Lesepult</option><option value="1">Menora</option></select></label></li>
<li><label><span>D</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="2">Ewiges Licht</option><option value="4">Frauenempore</option><option value="0">Toraschrein</option><option value="3">Lesepult</option><option value="1">Menora</option></select></label></li>
<li><label><span>E</span> <select name="frage-a3-4" data-left="4"><option value="">bitte wählen</option><option value="2">Ewiges Licht</option><option value="4">Frauenempore</option><option value="0">Toraschrein</option><option value="3">Lesepult</option><option value="1">Menora</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> A – Toraschrein; B – Menora; C – Ewiges Licht; D – Lesepult; E – Frauenempore</p>
<p class="question-explanation">Toraschrein und Ewiges Licht stehen im Osten, das Lesepult steht in der Mitte, die Frauenempore an der Seite.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Ohel-Jakob-Synagoge" rel="noopener">Ohel-Jakob-Synagoge (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-finish">Auswerten</button></p>
