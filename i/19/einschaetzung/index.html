ype":"multiple-choice","options":[{"text":"Juden bauen eine Laubhütte.","correct":true,"info":"Die Hütte hat ein Dach aus Blättern."},{"text":"Das Fest erinnert an die Wüstenwanderung.","correct":true,"info":"Die Israeliten hatten damals keine festen Unterkünfte."},{"text":"An Sukkot wird eine Kerze nach der anderen angezündet.","correct":false,"info":"Das gehört zu Chanukka, dem Weihefest."},{"text":"Die Kinder verkleiden sich.","correct":false,"info":"Das Verkleiden gehört zu Purim."}]},"rendered":{}}},{"key":"a8","ref":"/feste/herbstfeste-chanukka/#chanukka-tage","page":"feste/herbstfeste-chanukka/","exercise":"chanukka-tage","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a8","text":"Wie viele Tage dauert Chanukka?","explanation":"Acht Tage dauerte die Einweihung des Altars im Tempel. Darum brennen acht Tage lang Kerzen.","links":[{"title":"Jüdische Feiertage (Wikipedia)","url":"https://de.wikipedia.org/wiki/J%C3%BCdische_Feiertage"}],"type":"number","answer":8,"tolerance":0,"unit":"Tage","mistakes":[{"answer":7,"message":"Sieben Arme hat die Menora im Tempel, nicht so viele Tage dauert Chanukka."},{"answer":9,"message":"Neun Arme hat der Leuchter, aber das Fest dauert acht Tage."}]},"rendered":{}}},{"key":"a9","ref":"/feste/herbstfeste-chanukka/#herbst-reihenfolge","page":"feste/herbstfeste-chanukka/","exercise":"herbst-reihenfolge","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a9","text":"Bringe diese Feste in die Reihenfolge, in der sie im Herbst und Winter vorkommen.","explanation":"Auf das Neujahrsfest folgen zehn Tage später der Versöhnungstag und dann das Laubhüttenfest. Chanukka liegt später im Winter.","links":[{"title":"Jüdische Feiertage (Wikipedia)","url":"https://de.wikipedia.org/wiki/J%C3%BCdische_Feiertage"}],"type":"ordering","items":["Rosch ha-Schana","Jom Kippur","Sukkot","Chanukka"]},"rendered":{}}},{"key":"a10","ref":"/altes-testament/von-abraham-zum-land/#erzeltern-paare","page":"altes-testament/von-abraham-zum-land/","exercise":"erzeltern-paare","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a10","text":"Welche Paare sind Erzeltern?","explanation":"Zu den Erzeltern zählen Abraham und Sara sowie Isaak und Rebekka.","links":[{"title":"Abraham (Wikipedia)","url":"https://de.wikipedia.org/wiki/Abraham"}],"type":"multiple-choice","options":[{"text":"Abraham und Sara","correct":true,"info":"Abraham ist der erste Erzvater, Sara seine Frau."},{"text":"Isaak und Rebekka","correct":true,"info":"Isaak ist der Sohn von Abraham und Sara."},{"text":"Adam und Eva","correct":false,"info":"Adam und Eva kommen in der Schöpfungserzählung am Anfang der Bibel vor."}]},"rendered":{}}},{"key":"a11","ref":"/altes-testament/von-abraham-zum-land/#land-fuehrer","page":"altes-testament/von-abraham-zum-land/","exercise":"land-fuehrer","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a11","text":"Wer führt das Volk Israel in das verheißene Land?","explanation":"Josua führt das Volk, nicht Mose.","links":[{"title":"Josua (Wikipedia)","url":"https://de.wikipedia.org/wiki/Josua"}],"type":"single-choice","options":[{"text":"Josua","correct":true,"info":"Josua ist der Nachfolger des Mose."},{"text":"Mose","correct":false,"info":"Mose stirbt auf dem Berg Nebo, bevor das Volk ins Land zieht."},{"text":"Jakob","correct":false,"info":"Jakob lebte lange vor dem Auszug aus Ägypten."}]},"rendered":{}}},{"key":"a12","ref":"/altes-testament/von-abraham-zum-land/#zwoelf-staemme","page":"altes-testament/von-abraham-zum-land/","exercise":"zwoelf-staemme","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a12","text":"Von wie vielen Söhnen Jakobs leiten sich die Stämme Israels ab?","explanation":"Nach der Bibel hat Jakob zwölf Söhne. Von ihnen stammen die zwölf Stämme.","links":[{"title":"Zwölf Stämme Israels (Wikipedia)","url":"https://de.wikipedia.org/wiki/Zw%C3%B6lf_St%C3%A4mme_Israels"}],"type":"number","answer":12,"tolerance":0,"unit":"Söhne","mistakes":[{"answ
