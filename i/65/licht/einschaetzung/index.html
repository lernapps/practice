<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Zu welcher Gruppe gehört jede Lichtquelle?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Blitz</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">lebende Lichtquelle</option><option value="2">künstliche Lichtquelle</option><option value="0">natürliche Lichtquelle</option><option value="3">keine Lichtquelle</option></select></label></li>
<li><label><span>Glühwürmchen</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">lebende Lichtquelle</option><option value="2">künstliche Lichtquelle</option><option value="0">natürliche Lichtquelle</option><option value="3">keine Lichtquelle</option></select></label></li>
<li><label><span>Leuchtreklame</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">lebende Lichtquelle</option><option value="2">künstliche Lichtquelle</option><option value="0">natürliche Lichtquelle</option><option value="3">keine Lichtquelle</option></select></label></li>
<li><label><span>Mond</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">lebende Lichtquelle</option><option value="2">künstliche Lichtquelle</option><option value="0">natürliche Lichtquelle</option><option value="3">keine Lichtquelle</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Blitz – natürliche Lichtquelle; Glühwürmchen – lebende Lichtquelle; Leuchtreklame – künstliche Lichtquelle; Mond – keine Lichtquelle</p>
<p class="question-explanation">Den Blitz gibt es ohne den Menschen (natürlich), das Glühwürmchen ist ein Lebewesen (lebend), die
Leuchtreklame hat der Mensch gebaut (künstlich). Der Mond leuchtet nicht selbst, er wird von der Sonne
beleuchtet.
</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Lichtquelle" rel="noopener">Lichtquelle (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche dieser Körper sind Lichtquellen? Kreuze alle an.</legend>
<label class="question-option"><input type="checkbox" name="frage-a2" value="0"> <span>ein Stern am Nachthimmel</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="1"> <span>eine brennende Kerze</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="2"> <span>ein weißes Blatt Papier in der Sonne</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="3"> <span>ein Spiegel</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>ein Stern am Nachthimmel</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Sterne sind riesige, heiße Gaskugeln wie unsere Sonne. Sie leuchten selbst.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>eine brennende Kerze</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Flamme erzeugt selbst Licht. Die Kerze ist eine künstliche Lichtquelle.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>ein weißes Blatt Papier in der Sonne</strong></p><p>Das Papier sieht hell aus, weil es Sonnenlicht zurückwirft. Im Dunkeln leuchtet es nicht.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>ein Spiegel</strong></p><p>Ein Spiegel wirft nur Licht zurück, das auf ihn fällt. Er ist ein beleuchteter Körper.</p></li>
</ul>
<p class="question-explanation">Lichtquellen leuchten selbst, auch im Dunkeln. Papier und Spiegel werfen nur fremdes Licht zurück.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Lichtquelle" rel="noopener">Lichtquelle (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Auf dem Tisch liegt ein Apfel, die Deckenlampe brennt. Auf welchem Weg siehst du den Apfel?</legend>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>Lampe → Apfel → Auge</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>Lampe → Auge</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>Auge → Apfel</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Lampe → Apfel → Auge</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Apfel wird beleuchtet und lenkt das Licht in dein Auge. Das ist der indirekte Lichtweg.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Lampe → Auge</strong></p><p>Auf diesem direkten Weg siehst du die Lampe, nicht den Apfel.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Auge → Apfel</strong></p><p>Vom Auge geht kein Licht aus. Das Auge empfängt nur.</p></li>
</ul>
<p class="question-explanation">Den Apfel siehst du über den indirekten Lichtweg. Er ist ein Umlenker.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Sehen" rel="noopener">Sehen (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In einem völlig dunklen Raum steht ein rotes Fahrrad. Warum siehst du es nicht?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Kein Licht fällt auf das Fahrrad, also kann es kein Licht in dein Auge lenken.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Rote Gegenstände kann man im Dunkeln grundsätzlich nicht sehen.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Deine Augen brauchen erst eine Minute, um Strahlen auszusenden.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Kein Licht fällt auf das Fahrrad, also kann es kein Licht in dein Auge lenken.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Fahrrad ist ein Umlenker. Ohne Sender hat es kein Licht, das es umlenken kann.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Rote Gegenstände kann man im Dunkeln grundsätzlich nicht sehen.</strong></p><p>Die Farbe spielt keine Rolle. Auch ein weißes Fahrrad sähest du im völlig dunklen Raum nicht.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Deine Augen brauchen erst eine Minute, um Strahlen auszusenden.</strong></p><p>Augen senden keine Strahlen aus. Sie empfangen nur Licht.</p></li>
</ul>
<p class="question-explanation">Beleuchtete Körper siehst du nur, wenn eine Lichtquelle sie anstrahlt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Sehen" rel="noopener">Sehen (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was ist ein Lichtstrahl?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>ein Modell für ein unendlich schmales Lichtbündel</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>ein sehr helles Lichtbündel, das man im Nebel sieht</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>das Licht, das vom Auge zum Gegenstand geht</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>ein Modell für ein unendlich schmales Lichtbündel</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Man denkt sich das Lichtbündel immer schmaler, bis nur eine Linie bleibt. In Wirklichkeit gibt es das so nicht.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>ein sehr helles Lichtbündel, das man im Nebel sieht</strong></p><p>Im Nebel siehst du ein Lichtbündel, das eine Breite hat. Ein Lichtstrahl hat keine Breite.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>das Licht, das vom Auge zum Gegenstand geht</strong></p><p>Vom Auge geht kein Licht aus. Lichtstrahlen zeigen immer von der Lichtquelle weg.</p></li>
</ul>
<p class="question-explanation">Der Lichtstrahl ist ein Modell. Man zeichnet ihn als gerade Linie mit Pfeil.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Lichtstrahl" rel="noopener">Lichtstrahl (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie viele Kilometer legt Licht in einer Sekunde ungefähr zurück? Bis zu 1000 km daneben zählt noch.</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a6" aria-describedby="frage-a6-unit"> <span id="frage-a6-unit">km</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 300.000 km (erlaubte Abweichung: 1.000 km)</p>
<p class="question-explanation">Licht legt etwa 300 000 km pro Sekunde zurück, genau 299 792 458 m pro Sekunde.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Lichtgeschwindigkeit" rel="noopener">Lichtgeschwindigkeit (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-next">Weiter</button></p>

<h2 id="teil-3" tabindex="-1">Seite 3 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Aus welchem Fenster kann man die Lampe selbst sehen?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/fenster.svg" alt="Links eine Straßenlampe, daneben eine Mauer, die etwas höher ist als die Lampe. Weiter rechts ein Haus:

" loading="lazy" decoding="async"><figcaption><p>Lege das Lineal von der Mitte der Lampe zu jedem Fenster.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a7" value="0"> <span>nur aus Fenster C</span></label>
<label class="question-option"><input type="radio" name="frage-a7" value="1"> <span>aus Fenster A und B</span></label>
<label class="question-option"><input type="radio" name="frage-a7" value="2"> <span>aus allen drei Fenstern</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>nur aus Fenster C</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Linie von der Lampe zu C geht über die Mauer hinweg. Die Linien zu A und B treffen die Mauer.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>aus Fenster A und B</strong></p><p>A und B liegen tief. Die Linie von der Lampe zu ihnen geht durch die Mauer.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>aus allen drei Fenstern</strong></p><p>Die Mauer versperrt die geraden Wege zu A und B.</p></li>
</ul>

<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ab wie vielen Metern vor dem Scheinwerfer beleuchtet das Fernlicht die Straße? Lies am Maßstab ab.</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/auto-fern.svg" alt="Ein Auto von der Seite, darunter ein Maßstab von 0 bis 7 Meter ab dem Scheinwerfer. Vom Scheinwerfer geht
ein unterer Randstrahl schräg nach unten zur Straße und ein oberer Randstrahl fast waagrecht nach vorn.
" loading="lazy" decoding="async"><figcaption><p>Fernlicht. Suche die Stelle, wo der untere Randstrahl die Straße trifft.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a8" aria-describedby="frage-a8-unit"> <span id="frage-a8-unit">m</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 4 m</p>
<p class="question-explanation">Der untere Randstrahl trifft die Straße bei 4 m. Ab dort ist sie hell, und weil der obere Randstrahl die Straße nicht trifft, reicht das Licht sehr weit.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Fernlicht" rel="noopener">Fernlicht (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a9"><p class="explainer-assessment-label">Aufgabe 9</p><div class="question" id="frage-a9" data-id="a9" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was passiert vor allem mit dem Licht? Ordne zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>ein Spiegel</span> <select name="frage-a9-0" data-left="0"><option value="">bitte wählen</option><option value="1">Streuung</option><option value="2">Absorption</option><option value="0">Reflexion</option></select></label></li>
<li><label><span>ein weißes Blatt Papier</span> <select name="frage-a9-1" data-left="1"><option value="">bitte wählen</option><option value="1">Streuung</option><option value="2">Absorption</option><option value="0">Reflexion</option></select></label></li>
<li><label><span>ein schwarzer Pullover</span> <select name="frage-a9-2" data-left="2"><option value="">bitte wählen</option><option value="1">Streuung</option><option value="2">Absorption</option><option value="0">Reflexion</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> ein Spiegel – Reflexion; ein weißes Blatt Papier – Streuung; ein schwarzer Pullover – Absorption</p>
<p class="question-explanation">Der glatte Spiegel reflektiert in eine Richtung. Das raue Papier streut das Licht in alle Richtungen. Der
dunkle Pullover nimmt das Licht auf.
</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reflexion_(Physik)" rel="noopener">Reflexion (Physik) (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a10"><p class="explainer-assessment-label">Aufgabe 10</p><div class="question" id="frage-a10" data-id="a10" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Du zerknitterst ein Stück glatte Alufolie. Was passiert jetzt mit Licht, das darauf fällt?</legend>
<label class="question-option"><input type="radio" name="frage-a10" value="0"> <span>Es wird in viele verschiedene Richtungen gestreut.</span></label>
<label class="question-option"><input type="radio" name="frage-a10" value="1"> <span>Es wird wie vorher in eine Richtung reflektiert.</span></label>
<label class="question-option"><input type="radio" name="frage-a10" value="2"> <span>Es wird fast ganz absorbiert.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Es wird in viele verschiedene Richtungen gestreut.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Knicke bilden viele kleine Spiegel, die in verschiedene Richtungen zeigen.</p></li>
