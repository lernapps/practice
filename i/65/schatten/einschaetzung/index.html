<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Warum ist ein Teilschatten heller als der Kernschatten?</legend>
<label class="question-option"><input type="radio" name="frage-a8" value="0"> <span>Weil dort noch Licht von einem Teil der Lichtquelle ankommt.</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="1"> <span>Weil dort das Licht um den Gegenstand herumgeht.</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="2"> <span>Weil der Gegenstand dort etwas Licht durchlässt.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Weil dort noch Licht von einem Teil der Lichtquelle ankommt.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Gegenstand verdeckt die Röhre nur zum Teil. Der Rest leuchtet noch dorthin.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Weil dort das Licht um den Gegenstand herumgeht.</strong></p><p>Licht geht geradeaus. Es kommt von dem Teil der Röhre, den der Gegenstand nicht verdeckt.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Weil der Gegenstand dort etwas Licht durchlässt.</strong></p><p>Der Ball lässt kein Licht durch. Der Unterschied kommt allein von der Lichtquelle.</p></li>
</ul>
<p class="question-explanation">In den Teilschatten fällt Licht von dem Teil der Lichtquelle, den der Gegenstand nicht verdeckt.</p>

</ul>
</div>

</div></li>
