<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" font-family="sans-serif" font-size="16"><title>Draufsicht: Ole neben einer Mauer, Lena neben einer großen Kiste, Ben neben einer flachen Kiste</title><rect width="460" height="360" fill="#ffffff"/><rect x="120" y="40" width="10" height="100" fill="#777" stroke="#1a1a1a"/><rect x="300" y="90" width="120" height="100" fill="#999" stroke="#1a1a1a" stroke-width="2"/><rect x="180" y="300" width="140" height="50" fill="#999" stroke="#1a1a1a" stroke-width="2"/><circle cx="70" cy="130" r="14" fill="#f2c9a0" stroke="#1a1a1a" stroke-width="2"/><text x="48" y="135" text-anchor="end" font-size="16" font-weight="bold" fill="#1a1a1a">Ole</text><circle cx="300" cy="65" r="14" fill="#f2c9a0" stroke="#1a1a1a" stroke-width="2"/><text x="320" y="70" text-anchor="start" font-size="16" font-weight="bold" fill="#1a1a1a">Lena</text><circle cx="345" cy="290" r="14" fill="#f2c9a0" stroke="#1a1a1a" stroke-width="2"/><text x="365" y="295" text-anchor="start" font-size="16" font-weight="bold" fill="#1a1a1a">Ben</text><text x="360" y="145" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a">Kiste</text><text x="250" y="330" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a">Kiste</text><text x="125" y="30" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a">Mauer</text></svg>
