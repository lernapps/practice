name: practice build
description: >-
  Builds a valid submission (the artifact "intake" of the action validate) into a static site. It takes the pair that
  `lernapps create` gives an app made now: @lernapps/tooling at the version npm has as latest, and the exact version of
  @lernapps/app-templates it depends on (read from the registry without a token; the job stops with a clear error when
  that fails). It unpacks that package, uses the folder explainer/ as the app, replaces its src/ by the submitted tree
  (the template's main.ts stays; the example components and chapter go), installs with npm install (the template's lock
  file stays out of the package, as `create` leaves it out of an app), runs the components' tests (vp test, when the
  submission has components), builds with npm run build (the explainer's build checks the content and the components'
  code), and runs `lernapps check` on the bundle (docs/checks.md says which rules that is and which do not apply to a
  preview). Then every page gets <meta name="robots" content="noindex">. The result is the artifact "site" (only when
  the build passed) and the artifact "build" (build.json with the end of the log, always). The job needs
  contents: read and no secret: it runs the submitted components' code, so it must hold nothing worth taking. The
  logic is actions/build/build.ts, tested by test/build.test.ts. Use it in the job "build" of submission.yml, after
  a checkout of this repo.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: node "$GITHUB_ACTION_PATH/build.ts" pin
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: intake
        path: _intake
    # the template comes out of the package that npm holds at the pinned version, as `lernapps create` takes it
    - shell: bash
      run: |
        mkdir _pack
        npm pack "@lernapps/app-templates@$TEMPLATES" --silent --ignore-scripts --pack-destination _pack
        tar -xzf _pack/*.tgz -C _pack
        node "$GITHUB_ACTION_PATH/build.ts" template _pack/package _app "$TEMPLATES" "$TOOLING"
      env:
        TEMPLATES: ${{ steps.pin.outputs.templates }}
        TOOLING: ${{ steps.pin.outputs.tooling }}
    - shell: bash
      run: npm install --no-audit --no-fund
      working-directory: _app
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/build.ts" prepare _intake/tree _app/src
    - id: browser
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pin.outputs.tooling }}
        restore-keys: playwright-${{ runner.os }}-
    - id: run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/build.ts" run _app _out
    - if: always() && steps.browser.outcome == 'success' && steps.browser.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser.outputs.cache-primary-key }}
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build
        path: |
          _out/build.json
          _out/validation-report.yaml
        if-no-files-found: ignore
        retention-days: 3
    - if: steps.run.outputs.ok == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: site
        path: _out/site
        retention-days: 3
