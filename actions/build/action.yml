name: practice build
description: >-
  Builds a valid submission (the artifact "intake" of the action validate) into a static site. It takes app-templates
  at the commit that package.json pins (appTemplates.commit, the commit the tooling pins), uses the folder
  explainer/ as the app, replaces its src/ by the submitted tree (the template's main.ts stays; the example
  components and chapter go), installs with npm ci (first the root of app-templates, whose build the template's
  dependency file:.. needs; then the template, whose lock file pins the tooling), builds with npm run build, and runs
  `lernapps check` on the bundle (docs/pruefungen.md says which rules that is and which do not apply to a
  preview). Then every page gets <meta name="robots" content="noindex">. The result is the artifact "site" (only when
  the build passed) and the artifact "build" (build.json with the end of the log, always). The job needs
  contents: read and no secret; it runs the template's build tools on the submitted data files, nothing of the
  submission is executed. The logic is actions/build/build.ts, tested by test/build.test.ts. Use it in the job
  "build" of einreichung.yml, after a checkout of this repo.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: node "$GITHUB_ACTION_PATH/build.ts" pin
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.pin.outputs.repository }}
        ref: ${{ steps.pin.outputs.commit }}
        path: _templates # the whole tree: explainer/ depends on file:.. (the root)
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          _templates/package-lock.json
          _templates/explainer/package-lock.json
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: intake
        path: _intake
    # The root first: its prepare script builds dist/, which the template's file:.. dependency needs.
    - shell: bash
      run: npm ci --no-audit --no-fund
      working-directory: _templates
    - shell: bash
      run: npm ci --no-audit --no-fund
      working-directory: _templates/explainer
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/build.ts" prepare _intake/tree _templates/explainer/src
    - id: browser
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('_templates/explainer/package-lock.json') }}
        restore-keys: playwright-${{ runner.os }}-
    - id: run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/build.ts" run _templates/explainer _out
    - if: always() && steps.browser.outcome == 'success' && steps.browser.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser.outputs.cache-primary-key }}
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: build
        path: |
          _out/build.json
          _out/validation-report.yaml
        if-no-files-found: ignore
        retention-days: 3
    - if: steps.run.outputs.ok == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: site
        path: _out/site
        retention-days: 3
